<div class="app-shell">
  <button *ngIf="navOpen" class="nav-backdrop" type="button" aria-label="Cerrar menú" (click)="navOpen = false"></button>
  <aside id="primary-sidebar" class="sidebar" [class.sidebar-open]="navOpen" aria-label="Navegación principal">
    <a class="brand" routerLink="/dashboard" (click)="navOpen = false">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span><strong>Lexi</strong><small>Sistema de Gestión de Posgrado</small></span>
    </a>
    <nav class="side-nav" aria-label="Secciones">
      <span class="nav-group">General</span>
      <button type="button" (click)="navigateTo('')" [class.active-link]="isActive('dashboard')" [attr.aria-current]="isActive('dashboard') ? 'page' : null"><mat-icon>dashboard</mat-icon> Dashboard</button>
      <span class="nav-group">Inventario</span>
      <button type="button" (click)="navigateTo('items')" [class.active-link]="isActive('items')" [attr.aria-current]="isActive('items') ? 'page' : null"><mat-icon>inventory_2</mat-icon> Ítems</button>
      <button type="button" (click)="navigateTo('entries')" [class.active-link]="isActive('entries')" [attr.aria-current]="isActive('entries') ? 'page' : null"><mat-icon>move_to_inbox</mat-icon> Entradas</button>
      <button type="button" (click)="navigateTo('outputs')" [class.active-link]="isActive('outputs')" [attr.aria-current]="isActive('outputs') ? 'page' : null"><mat-icon>outbox</mat-icon> Salidas</button>
      <span class="nav-group">Documentación</span>
      <button type="button" (click)="navigateTo('seal-numbers')" [class.active-link]="isActive('seal-numbers')" [attr.aria-current]="isActive('seal-numbers') ? 'page' : null"><mat-icon>verified</mat-icon> Sellos</button>
      <button type="button" (click)="navigateTo('letter-numbers')" [class.active-link]="isActive('letter-numbers')" [attr.aria-current]="isActive('letter-numbers') ? 'page' : null"><mat-icon>mail_outline</mat-icon> Cartas</button>
      <span class="nav-group">Administración</span>
      <button *ngIf="permissionService.has(permissions.manageUsers)" type="button" (click)="navigateTo('users')" [class.active-link]="isActive('users')" [attr.aria-current]="isActive('users') ? 'page' : null"><mat-icon>group</mat-icon> Usuarios</button>
      <button *ngIf="permissionService.has(permissions.manageRoles)" type="button" (click)="navigateTo('roles')" [class.active-link]="isActive('roles')" [attr.aria-current]="isActive('roles') ? 'page' : null"><mat-icon>gavel</mat-icon> Roles</button>
      <button type="button" (click)="navigateTo('departamentos')" [class.active-link]="isActive('departamentos')" [attr.aria-current]="isActive('departamentos') ? 'page' : null"><mat-icon>apartment</mat-icon> Departamentos</button>
    </nav>
  </aside>
  <div class="workspace">
    <mat-toolbar class="main-toolbar">
      <button class="menu-toggle" mat-icon-button type="button" aria-label="Abrir menú" aria-controls="primary-sidebar" [attr.aria-expanded]="navOpen" (click)="navOpen = true"><mat-icon>menu</mat-icon></button>
      <div class="toolbar-heading"><span class="toolbar-eyebrow">Lexi / Posgrado</span><strong>{{ pageTitle }}</strong></div>
      <span class="toolbar-spacer"></span>
      <span class="user-summary"><strong>{{ user?.nombre || 'Usuario' }}</strong><small>{{ user?.role?.name || 'Rol' }}</small></span>
      <button mat-icon-button [matMenuTriggerFor]="userMenu" matTooltip="Mi cuenta" aria-label="Abrir menú de cuenta"><mat-icon>account_circle</mat-icon></button>
      <mat-menu #userMenu="matMenu">
        <div mat-menu-item disabled class="user-menu-label">{{ user?.nombre || 'Usuario' }} · {{ user?.role?.name || 'Rol' }}</div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Cerrar sesión</button>
      </mat-menu>
    </mat-toolbar>
    <main class="content-container"><router-outlet></router-outlet></main>
  </div>
</div>
