<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field *ngIf="isEditMode" appearance="outline" class="full-width">
      <mat-label>Número de Sello</mat-label>
      <input matInput formControlName="numeroSello" />
      <mat-error *ngIf="form.get('numeroSello')?.hasError('required')">
        Este campo es obligatorio.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Usuario (CI)</mat-label>
      <mat-select formControlName="user_ci" required>
        <mat-option *ngFor="let user of users" [value]="user.ci">
          {{ user.ci }} - {{ user.nombre }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('user_ci')?.hasError('required')">
        Este campo es obligatorio.
      </mat-error>
      <mat-hint *ngIf="usersLoading">Cargando usuarios…</mat-hint>
    </mat-form-field>
    <p *ngIf="usersError" class="dialog-error" role="alert">{{ usersError }}</p>


    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Observación</mat-label>
      <textarea matInput formControlName="observacion" rows="3"></textarea>
    </mat-form-field>

    <div *ngIf="!isEditMode" class="info-message">
      <mat-icon>info</mat-icon>
      <span>El número de sello se generará automáticamente.</span>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <div *ngIf="errorMessage" class="dialog-error" role="alert">
    <strong>{{ errorTitle }}</strong>
    <span>{{ errorMessage }}</span>
  </div>
  <button mat-button (click)="close()" [disabled]="saving">Cancelar</button>
  <button *ngIf="canRetrySameOperation" mat-stroked-button color="primary" (click)="retrySameOperation()" [disabled]="saving">
    Reintentar la misma operación
  </button>
  <button *ngIf="canStartNewOperation" mat-stroked-button color="warn" (click)="startNewOperation()" [disabled]="form.invalid || saving || usersLoading">
    Iniciar nueva operación
  </button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || saving || usersLoading || requiresAttemptDecision">
    {{ saving ? 'Guardando…' : (isEditMode ? 'Actualizar' : 'Guardar') }}
  </button>
</mat-dialog-actions>
