<h2 mat-dialog-title>{{ data ? 'Editar carta' : 'Nueva carta' }}</h2>
<form [formGroup]="form" (ngSubmit)="save()" class="document-form">
  <mat-dialog-content>
    <mat-form-field *ngIf="data" appearance="outline">
      <mat-label>Número de carta</mat-label>
      <input matInput [value]="generatedNumber" readonly>
    </mat-form-field>
    <p *ngIf="!data" class="info-message"><mat-icon>info</mat-icon> El número de carta se generará automáticamente.</p>
    <mat-form-field appearance="outline">
      <mat-label>Usuario (CI)</mat-label>
      <mat-select formControlName="user_ci" required>
        <mat-option *ngFor="let user of users" [value]="user.ci">{{ user.nombre }} ({{ user.ci }})</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('user_ci')?.hasError('required')">Selecciona un usuario.</mat-error>
      <mat-hint *ngIf="usersLoading">Cargando usuarios…</mat-hint>
    </mat-form-field>
    <p *ngIf="usersError" class="dialog-error" role="alert">{{ usersError }}</p>
    <mat-form-field appearance="outline">
      <mat-label>Observación</mat-label>
      <textarea matInput formControlName="observacion" rows="3"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <div *ngIf="errorMessage" class="dialog-error" role="alert">
      <strong>{{ errorTitle }}</strong>
      <span>{{ errorMessage }}</span>
    </div>
    <button mat-button type="button" (click)="close()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || saving || usersLoading">{{ saving ? 'Guardando…' : 'Guardar' }}</button>
  </mat-dialog-actions>
</form>
