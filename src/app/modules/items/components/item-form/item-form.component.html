<mat-card>
  <mat-card-header>
    <mat-card-title>{{ isEditMode ? 'Editar Ítem' : 'Nuevo Ítem' }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field class="full-width">
        <mat-label>Código</mat-label>
        <input matInput formControlName="codigo" [readonly]="isEditMode">
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombreItem">
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Unidad</mat-label>
        <input matInput formControlName="unidad">
      </mat-form-field>

      <p *ngIf="isEditMode" class="readonly-stock">
        <strong>Stock actual:</strong> {{ currentStock }}
      </p>

      <button mat-raised-button color="primary" (click)="save()">
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </button>
      <button mat-raised-button type="button" (click)="cancel()">Cancelar</button>
    </form>
  </mat-card-content>
</mat-card>
