<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title><h1>{{ isEditMode ? 'Editar Ítem' : 'Nuevo Ítem' }}</h1></mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p *ngIf="loadingItem" role="status">Cargando ítem…</p>
    <form [formGroup]="form" class="item-form" [class.loading-overlay]="loadingItem">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Código</mat-label>
        <input matInput formControlName="codigo" [readonly]="isEditMode">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombreItem">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Unidad</mat-label>
        <input matInput formControlName="unidad">
      </mat-form-field>

      <p *ngIf="isEditMode" class="readonly-stock">
        <strong>Stock actual:</strong> {{ currentStock }}
      </p>

      <div class="form-actions">
        <button mat-button type="button" (click)="cancel()">Cancelar</button>
        <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="loadingItem || saving || form.invalid">
          {{ saving ? 'Guardando…' : (isEditMode ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
