<section class="confirmation-dialog" [class]="'confirmation-dialog confirmation-dialog--' + variant">
  <header class="confirmation-dialog__header">
    <span class="confirmation-dialog__icon" aria-hidden="true">
      <mat-icon>{{ icon }}</mat-icon>
    </span>
    <h2 mat-dialog-title>{{ data.title }}</h2>
  </header>

  <mat-dialog-content>
    <p class="confirmation-dialog__description">{{ data.description }}</p>
    <p *ngIf="data.recordLabel" class="confirmation-dialog__record">
      <span>Registro</span>
      <strong>{{ data.recordLabel }}</strong>
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      type="button"
      mat-button
      class="confirmation-dialog__cancel"
      (click)="resolve(false)">
      {{ data.cancelLabel || 'Cancelar' }}
    </button>
    <button
      type="button"
      mat-flat-button
      class="confirmation-dialog__confirm"
      [class.confirmation-dialog__confirm--destructive]="variant === 'destructive'"
      (click)="resolve(true)">
      {{ data.confirmLabel }}
    </button>
  </mat-dialog-actions>
</section>
